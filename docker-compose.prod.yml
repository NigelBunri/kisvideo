# Production deployment config for the shared Lightsail box - NOT for
# local dev, use docker-compose.yml for that.
#
# Lean by necessity, not preference: this runs on the SAME server as
# Django/Nest/chat, which is tight on resources (2 CPU cores, 3.7GB RAM,
# ~725MB free at last check, already 1.4GB in swap). Confirmed directly
# against the real server (read-only `docker network ls`/`docker inspect`,
# 2026-09-07):
#
# - No separate postgres/redis containers for this service. Reuses the
#   EXISTING kis-postgres (a new `kis_video` database inside that same
#   Postgres instance/server - a manual `CREATE DATABASE kis_video`
#   step at deploy time, not something this compose file does) and the
#   EXISTING kis-redis, on Redis DB index 1 rather than the default 0
#   (index 0 already has live Django/Nest task traffic on it - a lesson
#   learned the hard way earlier the same day this was written, when a
#   test worker collided with a real task on the shared default DB).
# - Both existing containers live on `kis-production-network` (an
#   external network, created by the Django/Nest compose stack, not this
#   one) with no host port mapping - reachable by container name
#   (kis-postgres, kis-redis) from anything else joined to that same
#   network, never from the host or a different network.
# - `depends_on` can only reference services defined in THIS compose
#   file/project - it can't express "wait for kis-postgres/kis-redis,
#   which live in a different compose project" the way the dev file's
#   depends_on could for its own bundled postgres/redis. Those containers
#   are already part of the always-running core stack in practice, but
#   there's no compose-level startup ordering guarantee against them here
#   - worth knowing if this is ever deployed to a fresh network where that
#   isn't already true.
# - `worker --concurrency=1`, not the original 2 - only 2 CPU cores total
#   on this box, shared with live Django/Nest/chat traffic; ffmpeg
#   transcoding is the most CPU-hungry thing this service does (see
#   README.md's resource-sizing note for the reasoning behind this and
#   the memory limit below).
#
# Restart policies, healthcheck posture for THIS service's own containers,
# no bind-mounted source, and the shared upload-staging volume are
# unchanged from the original design - see git history for that reasoning
# if the original (non-shared-infra) version is ever needed again.

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file: .env.production
    networks:
      - kis-production-network
    volumes:
      - kis_video_uploads:/tmp/kis-video-uploads

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    restart: unless-stopped
    env_file: .env.production
    networks:
      - kis-production-network
    volumes:
      - kis_video_uploads:/tmp/kis-video-uploads
    # See README.md's "Resource sizing" section for the full derivation -
    # this is a measured value now, not a guess: dev-b0 wrapped real
    # ffmpeg invocations in `/usr/bin/time -l` against the actual
    # libx264/veryfast pipeline settings. Peak observed was ~376MB for a
    # single 720p rendition (renditions run sequentially, never
    # concurrently, so that's also the worker's peak); 512M leaves ~30%
    # headroom over that. Assumes source video tops out at 720p - revisit
    # before allowing higher-resolution uploads.
    deploy:
      resources:
        limits:
          memory: 512M

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file: .env.production
    networks:
      - kis-production-network
    # No uploads volume - beat only schedules, never touches a file.

networks:
  # external: true - this network already exists (created by the
  # Django/Nest compose stack at /opt/kis). This file must never define
  # its own `kis-production-network`, which would either fail (name
  # collision) or, worse, silently create a SECOND, different network with
  # the same name in a different compose project, leaving api/worker/beat
  # unable to actually reach kis-postgres/kis-redis despite no error at
  # deploy time.
  kis-production-network:
    external: true

volumes:
  kis_video_uploads:

services:
  api:
    build: .
    ports:
      - "8010:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kis_video
      POSTGRES_PASSWORD: kis_video
      POSTGRES_DB: kis_video
    ports:
      - "5433:5432"
    volumes:
      - kis_video_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  kis_video_pg:
